name: spectro_app
description: Spectro Capture — a focus-locked camera client for the Spectro Web spectrophotometer workflow.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Camera + hardware focus/exposure lock — the reason the native app is kept.
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  # Scan the laptop's pairing QR.
  mobile_scanner: ^6.0.0
  # Talk to Spectro Web (token resolve, SSE, multipart upload).
  http: ^1.2.2
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
