<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spectro Web — Deployment Checklist</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --panel2: #eef2f7; --line: #d8dee6;
    --t1: #1a2230; --t2: #4a5563; --t3: #7d8794; --accent: #2563eb;
    --ok: #16a34a; --code-bg: #0f1722;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 18px 80px;
  }
  main { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .mark { width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, #7c4dff, #5db0ff, #4ade80, #facc15, #fb7185); }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--t3); margin: 0 0 22px 44px; font-size: 13px; }
  .bar { height: 8px; border-radius: 99px; background: var(--panel2);
    overflow: hidden; margin: 0 0 26px; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .25s; }
  .progress-label { color: var(--t2); font-size: 13px; margin: -18px 0 26px; }
  section { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06); }
  section > h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: .01em; }
  section > .hint { color: var(--t3); font-size: 12.5px; margin: 0 0 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  .row { display: flex; gap: 11px; align-items: flex-start; }
  input[type=checkbox] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--ok); flex: none; cursor: pointer; }
  .text { flex: 1; }
  .text label { cursor: default; }
  li.done .text label { color: var(--t3); text-decoration: line-through; }
  .desc { color: var(--t3); font-size: 12.5px; margin-top: 3px; }
  .cmd { position: relative; margin-top: 9px; }
  .cmd pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 40px 11px 13px; overflow-x: auto; cursor: pointer;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cde3ff;
    transition: border-color .15s, box-shadow .15s; }
  .cmd:hover pre { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .copy { position: absolute; top: 7px; right: 7px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--t2); border-radius: 6px;
    font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .copy:hover { color: var(--t1); border-color: var(--accent); }
  .copy.copied { color: var(--ok); border-color: var(--ok); }
  .tag { display: inline-block; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; margin-left: 8px;
    background: var(--panel2); color: var(--t3); border: 1px solid var(--line); vertical-align: middle; }
  .tag.once { color: #7c3aed; } .tag.gitlab { color: #ea580c; } .tag.repeat { color: var(--accent); }
  .note { color: var(--t3); font-size: 12px; margin-top: 8px; padding-left: 2px; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .reset { background: none; border: 1px solid var(--line); color: var(--t3);
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-left: 44px; }
  .reset:hover { color: var(--t1); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header><div class="mark"></div><h1>Spectro Web — Deployment Checklist</h1></header>
  <p class="sub">Fully static site shipped via <b>deployd</b>: tag&nbsp;→&nbsp;GitLab&nbsp;CI&nbsp;→&nbsp;deployd&nbsp;→&nbsp;traefik. No database, no env, no persistent data. Your ticks are saved in this browser.</p>

  <div class="bar"><i id="barFill"></i></div>
  <p class="progress-label" id="progressLabel">0 of 0 done</p>

  <!-- Sections are built from the data below by the script -->
  <div id="sections"></div>

  <button class="reset" onclick="resetAll()">Reset all ticks</button>
</main>

<script>
const APP = "spectro-app";
const DOMAIN = "spectro.muzoo.io";
const VM = "mabelz";   // ssh alias of the deployd VM

const DATA = [
  {
    title: "0 · Before you start",
    tag: "once", tagText: "context",
    hint: "This app is a FULLY STATIC site — nginx serving a Next.js `output: export` bundle. No database, no app server, no API routes, no env vars, no persistent volume: all data and compute live in each user's browser (IndexedDB). Anything asking you for POSTGRES_*, AUTH_SECRET or an SMTP server is from the retired server era — it does not apply.",
    items: [
      { t: "deployd is the deploy controller — not a webhook script you maintain", d: "It manages the GitLab project webhook itself, verifies the tag + green pipeline + registry image via the GitLab API, then pulls docker-compose.prod.yml at that tag and deploys. The old docker/ folder, HMAC webhook job and cron-deploy.sh are all retired." },
      { t: "Confirm the deployd instance is ≥ v0.6.1", d: "Required for the injected-variable style this repo uses (compose pins image: …:${DEPLOYD_TAG} from the generated .deployd.env). The version is shown on deployd's /login page." },
      { t: "Prefer the /deployd skill for onboarding, deploys, rollbacks and status", d: "It talks to the deployd API directly. Needs DEPLOYD_URL + DEPLOYD_TOKEN in ~/.claude/skills/deployd/.env." },
    ],
  },
  {
    title: "1 · CI — nothing to configure",
    tag: "gitlab", tagText: "GitLab",
    hint: ".gitlab-ci.yml is self-contained and uses only GitLab's predefined registry variables. Do NOT add deploy jobs, webhook URLs or secrets to it.",
    items: [
      { t: "Verify no stale CI/CD variables remain", d: "Settings → CI/CD → Variables. DEPLOY_WEBHOOK_SECRET and DEPLOY_WEBHOOK_URL belonged to the retired webhook flow — delete them if still present." },
      { t: "Confirm the build job only builds + pushes", d: "One `build-and-push` job on tags matching /^v\\d+\\.\\d+\\.\\d+$/, context = repo ROOT, pushing $CI_REGISTRY_IMAGE:vX.Y.Z (+ :latest for layer cache).",
        cmd: "grep -A4 'rules:' .gitlab-ci.yml" },
      { t: "Check APP_VERSION reaches the bundle", d: "CI passes --build-arg APP_VERSION=$CI_COMMIT_TAG → NEXT_PUBLIC_APP_VERSION → the corner VersionBadge. A deployed page showing 'dev' means the arg was lost." },
    ],
  },
  {
    title: "2 · One-time onboarding (already done for " + APP + ")",
    tag: "once", tagText: "one-time",
    hint: "Only needed when onboarding a NEW app, or re-onboarding after a rebuild. " + APP + " has been onboarded since 2026-07-22 (domain " + DOMAIN + ", app_port 80).",
    items: [
      { t: "Point DNS at the deployd VM", d: "A record: " + DOMAIN + " → the VM's IP. If the domain is proxied through Cloudflare, use Full (strict) mode — traefik terminates TLS with a Let's Encrypt cert." },
      { t: "Register the app in deployd", d: "Slug + repo + domain + app_port 80 (nginx in the container). No data mounts — the app has no persistent state." },
      { t: "Give deployd a GitLab token with API + registry read", d: "deployd stores its OWN per-app copy of this token. Note the expiry: when it lapses, webhook pokes fail SILENTLY (no deploy row appears) and manual deploys 401. Fixing it is admin-only in the deployd UI (app → settings)." },
      { t: "Let deployd create the project webhook", d: "Do not hand-create one — deployd manages it." },
    ],
  },
  {
    title: "3 · Cut a release",
    tag: "repeat", tagText: "release",
    hint: "The whole release is one tag push. Run the gates first — per the project conventions, typecheck + tests must pass, plus a build for build-affecting changes and a CVE scan before committing.",
    items: [
      { t: "Run the pre-commit gates", cmd: "cd web && npm run typecheck && npm test && npm run build" },
      { t: "Run the CVE scan", d: "Two findings are known and ACCEPTED (next-internal pins: postcss@8.4.31 and a nested optional sharp) — do not try to 'fix' them.",
        cmd: "trivy fs --scanners vuln --severity HIGH,CRITICAL web" },
      { t: "Bump web/package.json version + commit", d: "Convention: chore(release): vX.Y.Z. Keep CLAUDE.md updated in the same commit when architecture or domain knowledge changed.",
        cmd: "git add -A && git commit -m 'chore(release): vX.Y.Z'" },
      { t: "Push main, then the tag", d: "The tag is what triggers everything: CI builds + pushes the image, deployd's webhook fires, deployd verifies tag + green pipeline + registry image, then deploys.",
        cmd: "git push origin main\ngit tag vX.Y.Z\ngit push origin vX.Y.Z" },
      { t: "Watch the pipeline go green", d: "deployd will not deploy a tag whose pipeline is not green — it verifies via the GitLab API." },
      { t: "Confirm deployd created a deploy row", d: "No row at all usually means the webhook poke failed — most often deployd's stored GitLab token has expired (see §2)." },
    ],
  },
  {
    title: "4 · Verify the deploy",
    tag: "repeat", tagText: "each release",
    hint: "Check container HEALTH first. traefik silently skips unhealthy containers — no router, no cert, no log line at the default level — which surfaces to the user as a TLS error, not an app error.",
    items: [
      { t: "Check health BEFORE anything else", d: "Anything other than 'healthy' explains a TLS/502 symptom on its own. The healthcheck probes 127.0.0.1 deliberately, not localhost: busybox wget resolves localhost to ::1 first while nginx binds IPv4 only, so a localhost probe is refused and the container is marked unhealthy.",
        cmd: "ssh " + VM + " \"docker inspect " + APP + "-app-1 --format '{{.State.Health.Status}}'\"" },
      { t: "Confirm the running image is the tag you just pushed",
        cmd: "ssh " + VM + " \"docker inspect " + APP + "-app-1 --format '{{.Config.Image}}'\"" },
      { t: "Load the site over HTTPS", cmd: "curl -sI https://" + DOMAIN + "/ | head -1" },
      { t: "Check the version badge matches the tag", d: "Bottom-right corner of any page. 'dev' means APP_VERSION never reached the build." },
      { t: "Smoke-test the actual workflow in a real browser", d: "The one thing no test covers: IndexedDB + the file picker. Create an experiment → upload the lamp → calibrate → blank → standards → unknown → report → export .spectro.zip → re-import it." },
      { t: "If Cloudflare shows 526", d: "That is traefik serving its default cert — almost always an unhealthy container (see the first item), not a certificate problem. Cloudflare masks the origin, so external probes cannot tell DNS, traefik and app failures apart; check on the VM." },
    ],
  },
  {
    title: "5 · Rollback & maintenance",
    tag: "repeat", tagText: "ongoing",
    hint: "There is nothing to back up on the server — no database, no uploads, no volumes. A user's data lives only in their own browser, so the app's only 'backup' story is the student-facing .spectro.zip export on the experiments list page.",
    items: [
      { t: "Roll back to a previous tag", d: "Redeploy an earlier vX.Y.Z through deployd (UI or the /deployd skill). Because the image is pinned by ${DEPLOYD_TAG}, a rollback is just a redeploy of the older tag." },
      { t: "Never roll back by deleting a tag", d: "deployd verifies the tag against the GitLab API; removing it breaks the audit trail without changing what is running." },
      { t: "Keep dependencies patched", d: "Re-run the CVE scan periodically and bump next / sharp when advisories land; each bump is a normal release through §3." },
      { t: "Remind users that data is per-browser", d: "Clearing site data wipes an experiment permanently. Exporting is the only backup — there is no server copy to restore from." },
    ],
  },
];

const KEY = "spectro-deploy-checklist-v2";
const state = JSON.parse(localStorage.getItem(KEY) || "{}");

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  const root = document.getElementById("sections");
  root.innerHTML = "";
  let id = 0, total = 0, done = 0;
  for (const sec of DATA){
    const s = document.createElement("section");
    s.innerHTML = `<h2>${esc(sec.title)}<span class="tag ${sec.tag}">${esc(sec.tagText)}</span></h2>
      <p class="hint">${esc(sec.hint)}</p>`;
    const ul = document.createElement("ul");
    for (const it of sec.items){
      const key = "i" + (id++);
      const checked = !!state[key];
      total++; if (checked) done++;
      const li = document.createElement("li");
      if (checked) li.className = "done";
      const cmdHtml = it.cmd ? `<div class="cmd"><pre><code>${esc(it.cmd)}</code></pre><button class="copy">copy</button></div>` : "";
      const descHtml = it.d ? `<div class="desc">${esc(it.d)}</div>` : "";
      li.innerHTML = `<div class="row">
          <input type="checkbox" ${checked?"checked":""} data-key="${key}" />
          <div class="text"><label>${esc(it.t)}</label>${descHtml}${cmdHtml}</div>
        </div>`;
      ul.appendChild(li);
    }
    s.appendChild(ul);
    root.appendChild(s);
  }
  document.getElementById("barFill").style.width = total ? (done/total*100)+"%" : "0";
  document.getElementById("progressLabel").textContent = `${done} of ${total} done`;
}

document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox]")){
    state[e.target.dataset.key] = e.target.checked;
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  }
});
document.addEventListener("click", e => {
  const cmd = e.target.closest(".cmd");
  if (!cmd) return;                       // click anywhere on the code block to copy
  const code = cmd.querySelector("code").innerText;
  const btn = cmd.querySelector(".copy");
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "copied"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1200);
  });
});
function resetAll(){
  if (!confirm("Clear all ticks?")) return;
  for (const k in state) delete state[k];
  localStorage.removeItem(KEY); render();
}
render();
</script>
</body>
</html>
