<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spectro Web — Deployment Checklist</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --panel2: #eef2f7; --line: #d8dee6;
    --t1: #1a2230; --t2: #4a5563; --t3: #7d8794; --accent: #2563eb;
    --ok: #16a34a; --code-bg: #0f1722;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 18px 80px;
  }
  main { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .mark { width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, #7c4dff, #5db0ff, #4ade80, #facc15, #fb7185); }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--t3); margin: 0 0 22px 44px; font-size: 13px; }
  .bar { height: 8px; border-radius: 99px; background: var(--panel2);
    overflow: hidden; margin: 0 0 26px; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .25s; }
  .progress-label { color: var(--t2); font-size: 13px; margin: -18px 0 26px; }
  section { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06); }
  section > h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: .01em; }
  section > .hint { color: var(--t3); font-size: 12.5px; margin: 0 0 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  .row { display: flex; gap: 11px; align-items: flex-start; }
  input[type=checkbox] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--ok); flex: none; cursor: pointer; }
  .text { flex: 1; }
  .text label { cursor: default; }
  li.done .text label { color: var(--t3); text-decoration: line-through; }
  .desc { color: var(--t3); font-size: 12.5px; margin-top: 3px; }
  .cmd { position: relative; margin-top: 9px; }
  .cmd pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 40px 11px 13px; overflow-x: auto; cursor: pointer;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cde3ff;
    transition: border-color .15s, box-shadow .15s; }
  .cmd:hover pre { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .copy { position: absolute; top: 7px; right: 7px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--t2); border-radius: 6px;
    font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .copy:hover { color: var(--t1); border-color: var(--accent); }
  .copy.copied { color: var(--ok); border-color: var(--ok); }
  .tag { display: inline-block; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; margin-left: 8px;
    background: var(--panel2); color: var(--t3); border: 1px solid var(--line); vertical-align: middle; }
  .tag.once { color: #7c3aed; } .tag.gitlab { color: #ea580c; } .tag.repeat { color: var(--accent); }
  .note { color: var(--t3); font-size: 12px; margin-top: 8px; padding-left: 2px; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .reset { background: none; border: 1px solid var(--line); color: var(--t3);
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-left: 44px; }
  .reset:hover { color: var(--t1); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header><div class="mark"></div><h1>Spectro Web — Deployment Checklist</h1></header>
  <p class="sub">Password-auth web app shipped via the tag&nbsp;→&nbsp;GitLab&nbsp;CI&nbsp;→&nbsp;webhook&nbsp;→&nbsp;server pipeline. Your ticks are saved in this browser.</p>

  <div class="bar"><i id="barFill"></i></div>
  <p class="progress-label" id="progressLabel">0 of 0 done</p>

  <!-- Sections are built from the data below by the script -->
  <div id="sections"></div>

  <button class="reset" onclick="resetAll()">Reset all ticks</button>
</main>

<script>
const PLACEHOLDERS = "Replace &lt;group&gt;, the domain, the SSH target and the deploy path with your real values.";
const DEPLOY_DIR = "~/containers/spectro-app";

const DATA = [
  {
    title: "1 · GitLab CI/CD variables",
    tag: "gitlab", tagText: "GitLab UI",
    hint: "Settings → CI/CD → Variables (mask them). These are unchanged from the old pipeline — verify they still exist.",
    items: [
      { t: "DEPLOY_WEBHOOK_SECRET — HMAC secret shared with the webhook server", d: "Must match the secret the webhook-deploy receiver verifies." },
      { t: "DEPLOY_WEBHOOK_URL — full webhook endpoint URL", d: "e.g. https://hooks.example.com/hooks/spectro-app-deploy" },
    ],
  },
  {
    title: "2 · Server — one-time prep",
    tag: "once", tagText: "one-time",
    hint: "Run on the server unless noted. Assumes Docker + the Compose plugin, and nginx-proxy + acme-companion already running.",
    items: [
      { t: "Point DNS at the server", d: "Add an A record: spectro.yourdomain.com → server IP." },
      { t: "Create the shared proxy network", d: "The app's compose joins this external network for routing + TLS.",
        cmd: "docker network create nginx-proxy" },
      { t: "Create the deploy directory (the rsync target)", cmd: "mkdir -p " + DEPLOY_DIR },
      { t: "Log in to the GitLab Container Registry", d: "So the cron poller can pull the private image. Use a read-only deploy token.",
        cmd: "docker login registry.gitlab.com" },
      { t: "Sync the docker/ folder to the server", d: "Run from your machine, at the repo root. --exclude '.env' keeps the server-managed secrets file from being overwritten.",
        cmd: "rsync -av --exclude='.env' docker/ user@server:" + DEPLOY_DIR + "/" },
      { t: "Create the server .env from the example", cmd: "cp " + DEPLOY_DIR + "/.env.example " + DEPLOY_DIR + "/.env" },
      { t: "Generate AUTH_SECRET and fill in .env", d: "Set POSTGRES_*, DATABASE_URL (host = db), AUTH_SECRET (below), AUTH_URL=https://your-domain, EMAIL_SERVER/EMAIL_FROM (real SMTP — needed for password reset), VIRTUAL_HOST, LETSENCRYPT_HOST, SPECTRO_APP_IMAGE.",
        cmd: "openssl rand -base64 33   # paste as AUTH_SECRET\nnano " + DEPLOY_DIR + "/.env" },
      { t: "Install the cron deploy poller", d: "Polls the webhook trigger file every minute and runs compose up on a new tag. Add the line to your crontab.",
        cmd: "( crontab -l 2>/dev/null; echo '* * * * * " + DEPLOY_DIR + "/cron-deploy.sh' ) | crontab -" },
    ],
  },
  {
    title: "3 · First deploy & verify",
    tag: "repeat", tagText: "release",
    hint: "Either push a tag (triggers CI end-to-end) or start it once by hand.",
    items: [
      { t: "Cut a release tag (from your machine)", d: "Triggers GitLab: build + push image → webhook → server cron pulls + deploys. Migrations run automatically on app boot.",
        cmd: "git push origin main\ngit tag v1.0.0\ngit push origin v1.0.0" },
      { t: "…or start it once manually on the server", d: "Useful for the very first boot before any tag exists (set SPECTRO_APP_IMAGE in .env first).",
        cmd: "cd " + DEPLOY_DIR + " && docker compose --env-file .env up -d" },
      { t: "Check the containers and logs", d: "Expect the app log to show 'migrate deploy' then 'Ready', and db healthy.",
        cmd: "cd " + DEPLOY_DIR + " && docker compose ps\ndocker compose logs -f app" },
      { t: "Register an account in the browser", d: "Open https://your-domain/register — you should be signed straight in." },
      { t: "Test password reset", d: "Use /forgot-password and confirm the reset email arrives at your SMTP inbox." },
    ],
  },
  {
    title: "4 · Maintenance",
    tag: "repeat", tagText: "ongoing",
    hint: "Data lives in two named volumes. Back up Postgres regularly.",
    items: [
      { t: "Confirm the volume names", d: "Compose prefixes volumes with the deploy-dir name (e.g. spectro-app_pgdata). Check before backing up.",
        cmd: "docker volume ls | grep -E 'pgdata|uploads'" },
      { t: "Back up the Postgres volume", d: "Adjust the volume name to what the previous step showed.",
        cmd: "docker run --rm -v spectro-app_pgdata:/v -v \"$PWD\":/b alpine \\\n  tar czf /b/pgdata-$(date +%F).tar.gz -C /v ." },
      { t: "Roll out an update", d: "Just push a higher vX.Y.Z tag — cron-deploy.sh only deploys strictly greater versions.",
        cmd: "git tag v1.0.1 && git push origin v1.0.1" },
    ],
  },
];

const KEY = "spectro-deploy-checklist-v1";
const state = JSON.parse(localStorage.getItem(KEY) || "{}");

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  const root = document.getElementById("sections");
  root.innerHTML = "";
  let id = 0, total = 0, done = 0;
  for (const sec of DATA){
    const s = document.createElement("section");
    s.innerHTML = `<h2>${esc(sec.title)}<span class="tag ${sec.tag}">${esc(sec.tagText)}</span></h2>
      <p class="hint">${esc(sec.hint)}</p>`;
    const ul = document.createElement("ul");
    for (const it of sec.items){
      const key = "i" + (id++);
      const checked = !!state[key];
      total++; if (checked) done++;
      const li = document.createElement("li");
      if (checked) li.className = "done";
      const cmdHtml = it.cmd ? `<div class="cmd"><pre><code>${esc(it.cmd)}</code></pre><button class="copy">copy</button></div>` : "";
      const descHtml = it.d ? `<div class="desc">${esc(it.d)}</div>` : "";
      li.innerHTML = `<div class="row">
          <input type="checkbox" ${checked?"checked":""} data-key="${key}" />
          <div class="text"><label>${esc(it.t)}</label>${descHtml}${cmdHtml}</div>
        </div>`;
      ul.appendChild(li);
    }
    s.appendChild(ul);
    root.appendChild(s);
  }
  document.getElementById("barFill").style.width = total ? (done/total*100)+"%" : "0";
  document.getElementById("progressLabel").textContent = `${done} of ${total} done`;
}

document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox]")){
    state[e.target.dataset.key] = e.target.checked;
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  }
});
document.addEventListener("click", e => {
  const cmd = e.target.closest(".cmd");
  if (!cmd) return;                       // click anywhere on the code block to copy
  const code = cmd.querySelector("code").innerText;
  const btn = cmd.querySelector(".copy");
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "copied"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1200);
  });
});
function resetAll(){
  if (!confirm("Clear all ticks?")) return;
  for (const k in state) delete state[k];
  localStorage.removeItem(KEY); render();
}
render();
</script>
</body>
</html>
