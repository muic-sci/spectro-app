<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectro — two-device prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--desk); color: var(--t3); font-family: var(--font-mono); font-size: 13px; letter-spacing: 1px; z-index: 999; }
    #boot .b { width: 220px; height: 4px; border-radius: 99px; background: var(--spectrum); margin-top: 16px; opacity: 0.5; animation: pulse-soft 1.4s infinite; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot"><div style="text-align:center"><div>SPECTRO</div><div class="b"></div></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- frames + tweaks shell -->
  <script type="text/babel" src="frames/browser-window.jsx"></script>
  <script type="text/babel" src="frames/ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- model -->
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="store.jsx"></script>

  <!-- primitives -->
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="sci.jsx"></script>

  <!-- screens -->
  <script type="text/babel" src="wizard.jsx"></script>
  <script type="text/babel" src="steps.jsx"></script>
  <script type="text/babel" src="laptop.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="phone.jsx"></script>

  <!-- mount -->
  <script type="text/babel" src="app.jsx"></script>
  <script>
    // remove boot splash once React mounts
    const obs = new MutationObserver(() => { if (document.querySelector('#root').children.length) { const b = document.getElementById('boot'); if (b) b.remove(); obs.disconnect(); } });
    obs.observe(document.getElementById('root'), { childList: true });
    setTimeout(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, 6000);
  </script>
</body>
</html>
