<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spectro App — Lego Spectrophotometer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spectro App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Spectro App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Page ─────────────────────────────────────────────────────────── */
    html, body { height: 100%; }

    body {
      background: radial-gradient(ellipse at center, #1b2a4a 0%, #0d1117 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-family: system-ui, sans-serif;
    }

    .device-label {
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      user-select: none;
    }

    /* ── Phone shell (bezel) ──────────────────────────────────────────── */
    .phone-shell {
      position: relative;
      width: 393px;          /* iPhone 15 Pro width  */
      background: #111;
      border-radius: 55px;
      /* layered box-shadow: inner screen edge, body rim, outer highlight, drop */
      box-shadow:
        inset 0 0 0 1px #555,
        0 0 0 2px #222,
        0 0 0 4px #555,
        0 0 0 6px #222,
        0 60px 120px rgba(0, 0, 0, 0.9);
    }

    /* Power button — right side */
    .phone-shell::before {
      content: '';
      position: absolute;
      right: -8px;
      top: 165px;
      width: 4px;
      height: 72px;
      background: #3a3a3a;
      border-radius: 0 3px 3px 0;
    }

    /* Volume up + down — left side */
    .phone-shell::after {
      content: '';
      position: absolute;
      left: -8px;
      top: 120px;
      width: 4px;
      height: 48px;
      background: #3a3a3a;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 68px 0 #3a3a3a;   /* volume down */
    }

    /* ── Screen area (clips Flutter to rounded rect) ─────────────────── */
    .phone-screen {
      position: relative;
      margin: 6px;
      border-radius: 50px;
      overflow: hidden;
      background: #000;
    }

    /* Dynamic island — overlaid on top of Flutter */
    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
    }

    /* ── Flutter host — engine renders into this element ─────────────── */
    #flutter-host {
      width: 381px;    /* 393 - 6px margin each side */
      height: 852px;   /* iPhone 15 Pro logical height */
      display: block;
      position: relative;
    }

    /* ── Responsive scaling ───────────────────────────────────────────── */
    /* Scale down the whole phone shell if the viewport is too short      */
    @media (max-height: 980px) {
      .phone-shell { transform: scale(0.90); transform-origin: center top; }
    }
    @media (max-height: 880px) {
      .phone-shell { transform: scale(0.80); transform-origin: center top; }
    }
    @media (max-height: 780px) {
      .phone-shell { transform: scale(0.70); transform-origin: center top; }
    }
    @media (max-height: 680px) {
      .phone-shell { transform: scale(0.60); transform-origin: center top; }
    }

    /* ── Full-screen host (mobile) ───────────────────────────────────── */
    #flutter-fullscreen { display: none; }

    /* On a real phone browser: drop the frame, go full-screen */
    @media (max-width: 500px) {
      body { background: none; justify-content: flex-start; padding: 0; }
      .device-label, .phone-shell { display: none; }
      #flutter-fullscreen {
        display: block;
        width: 100vw;
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <span class="device-label">Spectro App &nbsp;·&nbsp; Mobile Preview</span>

  <div class="phone-shell">
    <div class="phone-screen">
      <div class="dynamic-island"></div>
      <!-- Flutter renders here on desktop (inside phone frame) -->
      <div id="flutter-host"></div>
    </div>
  </div>

  <!-- Flutter renders here on mobile (full-screen, no frame) -->
  <div id="flutter-fullscreen"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
