# nginx config for the static Spectro Web export (Next.js `output: export`).
# Pages are emitted as `/experiment.html`, `/experiments/new.html`, etc.; the
# try_files rule maps clean URLs (and ?id= query routes) to their .html file.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed, immutable build assets.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clean URLs → static .html (e.g. /experiment?id=… → /experiment.html).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
