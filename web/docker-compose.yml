# Local development services for Spectro Web.
# `docker compose up -d` then copy .env.example → .env and run `npm run prisma:migrate`.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Same POSTGRES_* as .env so the app's built connection string matches.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spectro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spectro}
      POSTGRES_DB: ${POSTGRES_DB:-spectro}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - spectro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spectro} -d ${POSTGRES_DB:-spectro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev SMTP inbox — password-reset emails land in the web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (matches EMAIL_SERVER in .env.example)
      - "8025:8025" # web UI

volumes:
  spectro_pgdata:
