# docker-compose.prod.yml — production compose for the deployd controller.
#
# deployd fetches this file from the repo at the released tag and deploys it
# with the generated `.deployd.env` (injected-variable style): ${DEPLOYD_TAG}
# pins the image to the release vX.Y.Z, and the override routes the app's
# domain (traefik) to port 80 inside the container, where nginx serves the
# static export. Do NOT publish ports or add traefik labels here — the
# override handles routing.
#
# Fully static site: no database, no app server, no env, no persistent data —
# everything (data + compute) lives in each user's browser (IndexedDB), so
# there are no ${DEPLOYD_DATA_DIR} bind mounts either.
services:
  app:
    image: registry.gitlab.com/muzoo/muic/spectro-app:${DEPLOYD_TAG}
    restart: unless-stopped
