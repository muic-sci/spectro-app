# Production deployment for Spectro Web (Next.js + Postgres).
#
# This folder is rsync'd to the server; cron-deploy.sh (in this dir) pulls the
# tagged image and runs `docker compose up -d` on each release. The app applies
# DB migrations on boot (see web/docker-entrypoint.sh).
#
# Server-managed `.env` (NOT rsync'd — keep it out of the sync) supplies every
# ${VAR} below. See .env.example.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Bind-mount to a host path (set POSTGRES_DATA_DIR in .env). Relative
      # paths resolve against this compose file's directory. Easy to back up.
      - ${POSTGRES_DATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  app:
    # CI/CD deploy: SPECTRO_APP_IMAGE=registry.gitlab.com/<group>/spectro-app:latest
    image: ${SPECTRO_APP_IMAGE:-spectro-app}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # App config (read at runtime + by `prisma migrate deploy` on boot).
      # The connection string is built from POSTGRES_* in src/lib/database-url.ts
      # (host = the `db` service); no duplicated DATABASE_URL.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - EMAIL_SERVER=${EMAIL_SERVER}
      - EMAIL_FROM=${EMAIL_FROM}
      - SPECTRO_STORAGE_DIR=${SPECTRO_STORAGE_DIR:-/data/uploads}
      # nginx-proxy + acme-companion read these to route + issue TLS.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    volumes:
      # Bind-mount the captured-image store: host UPLOADS_DIR -> the in-container
      # SPECTRO_STORAGE_DIR (kept in sync with the env var above). Relative host
      # paths resolve against this compose file's directory.
      - ${UPLOADS_DIR:-./uploads}:${SPECTRO_STORAGE_DIR:-/data/uploads}
    # The reverse proxy is connected MANUALLY after `up`, not via compose:
    #   docker network connect nginx-docker $(docker compose ps -q app)
    # (VIRTUAL_HOST / VIRTUAL_PORT / LETSENCRYPT_HOST above are read by the proxy
    # once the app shares its network.)
