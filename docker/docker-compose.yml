services:
  spectro-app:
    image: spectro-app              # used when image is pre-loaded via docker load
    build:
      context: ..                   # project root (only needed when building locally)
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # nginx-proxy reads these to route traffic and issue certificates.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    networks:
      - default

# Use the default network for nginx-proxy and connect via terminal commands:
# docker network connect spectro-app_default nginx-proxy