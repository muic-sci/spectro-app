services:
  spectro-app:
    build:
      context: ..                   # project root
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # nginx-proxy reads these to route traffic and issue certificates.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    networks:
      - nginx-proxy                 # must match the network nginx-proxy runs on

networks:
  # This network is created externally by the nginx-proxy + acme-companion
  # stack. Run `docker network create nginx-proxy` if it does not exist yet.
  nginx-proxy:
    external: true
