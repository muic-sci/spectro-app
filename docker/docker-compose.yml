# Production deployment for Spectro Web (Next.js + Postgres).
#
# This folder is rsync'd to the server; cron-deploy.sh (in this dir) pulls the
# tagged image and runs `docker compose up -d` on each release. The app applies
# DB migrations on boot (see web/docker-entrypoint.sh).
#
# Server-managed `.env` (NOT rsync'd — keep it out of the sync) supplies every
# ${VAR} below. See .env.example.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  app:
    # CI/CD deploy: SPECTRO_APP_IMAGE=registry.gitlab.com/<group>/spectro-app:latest
    image: ${SPECTRO_APP_IMAGE:-spectro-app}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # App config (read at runtime + by `prisma migrate deploy` on boot).
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - EMAIL_SERVER=${EMAIL_SERVER}
      - EMAIL_FROM=${EMAIL_FROM}
      - SPECTRO_STORAGE_DIR=/data/uploads
      # nginx-proxy + acme-companion read these to route + issue TLS.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    volumes:
      - uploads:/data/uploads
    networks:
      - default
      - nginx-proxy

volumes:
  pgdata:
  uploads:

networks:
  # The app joins the shared nginx-proxy network (created once on the server:
  # `docker network create nginx-proxy`). Postgres stays on `default` only.
  nginx-proxy:
    external: true
