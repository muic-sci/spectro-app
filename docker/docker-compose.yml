# Production deployment for Spectro Web — a fully static site served by nginx.
#
# This folder is rsync'd to the server; cron-deploy.sh (in this dir) pulls the
# tagged image and runs `docker compose up -d` on each release. There is no
# database, no app server and no persistent volume — everything (data + compute)
# lives in each user's browser (IndexedDB). The image just serves static files.
#
# Server-managed `.env` (NOT rsync'd) supplies every ${VAR} below. See .env.example.
services:
  app:
    # CI/CD deploy: SPECTRO_APP_IMAGE=registry.gitlab.com/<group>/spectro-app:latest
    image: ${SPECTRO_APP_IMAGE:-spectro-app}
    restart: unless-stopped
    environment:
      # nginx-proxy + acme-companion read these to route + issue TLS. The static
      # site is served on :80 inside the container.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    # The reverse proxy is wired out-of-band, not via compose: connect your
    # nginx-proxy CONTAINER to THIS app's network (compose recreates that network
    # each `up`). cron-deploy.sh does this automatically when PROXY_CONTAINER is
    # set; by hand it's e.g.:
    #   docker network connect <deploy-dir>_default nginx-proxy
