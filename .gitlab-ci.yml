# GitLab CI/CD for spectro-app
# Builds and pushes the Spectro Web Docker image to the GitLab Container
# Registry, then triggers deployment via the webhook-with-curl server.
# The image is a fully STATIC site (Next.js `output: export`) served by nginx on
# :80 — no database, no app server, no migrations. The server compose (docker/)
# runs just that one static container behind nginx-proxy.
#
# Triggered only on tags matching vX.Y.Z (e.g. v1.0.0, v2.10.3).
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   DEPLOY_WEBHOOK_SECRET  — HMAC secret shared with the webhook server
#   DEPLOY_WEBHOOK_URL     — full URL to the webhook endpoint, e.g.
#                            https://hooks.example.com/hooks/spectro-app-deploy

stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_DRIVER: overlay2

# ── Build & push ──────────────────────────────────────────────────────────────
build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Pull :latest for layer caching (the npm-ci deps layer is reused while
    # package-lock.json is unchanged).
    - docker pull $IMAGE_NAME:latest || true
    - docker build
        --cache-from $IMAGE_NAME:latest
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg APP_VERSION=$CI_COMMIT_TAG
        --tag $IMAGE_NAME:$CI_COMMIT_TAG
        --tag $IMAGE_NAME:latest
        -f web/Dockerfile
        web
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG
    - docker push $IMAGE_NAME:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── Trigger deployment via webhook ────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl openssl
  script:
    - |
      PAYLOAD='{"trigger":"spectro-app","ref":"'"$CI_COMMIT_REF_NAME"'","tag":"'"$CI_COMMIT_TAG"'","sha":"'"$CI_COMMIT_SHA"'"}'
      SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')"
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -X POST \
        -H "Content-Type: application/json" \
        -H "X-Hub-Signature-256: $SIGNATURE" \
        -d "$PAYLOAD" \
        "$DEPLOY_WEBHOOK_URL")
      if [ "$HTTP_STATUS" -eq 200 ]; then
        echo "Deployment triggered successfully (tag: $CI_COMMIT_TAG)"
      else
        echo "Webhook returned HTTP $HTTP_STATUS — deployment not triggered"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - build-and-push
