# GitLab CI/CD for spectro-app
# Builds and pushes the Flutter web Docker image to the GitLab Container Registry,
# then triggers deployment via the webhook-with-curl server.
#
# Triggered only on tags matching vX.Y.Z (e.g. v1.0.0, v2.10.3).
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   DEPLOY_WEBHOOK_SECRET  — HMAC secret shared with the webhook server
#   DEPLOY_WEBHOOK_URL     — full URL to the webhook endpoint, e.g.
#                            https://hooks.example.com/hooks/spectro-app-deploy

stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

# ── Build & push ──────────────────────────────────────────────────────────────
build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # DOCKER_BUILDKIT=1 enables BuildKit for regular docker build, which
    # correctly invalidates cached layers when ARG values change. This ensures
    # the RUN printf step always writes the real tag, not a cached "dev".
    - docker build
        --cache-from $IMAGE_NAME:latest
        --build-arg APP_VERSION=$CI_COMMIT_TAG
        --tag $IMAGE_NAME:$CI_COMMIT_TAG
        --tag $IMAGE_NAME:latest
        -f docker/Dockerfile
        .

    # Push both the versioned tag and latest
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG
    - docker push $IMAGE_NAME:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── Trigger deployment via webhook ────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl openssl
  script:
    - |
      # Build JSON payload
      PAYLOAD='{"trigger":"spectro-app","ref":"'"$CI_COMMIT_REF_NAME"'","tag":"'"$CI_COMMIT_TAG"'","sha":"'"$CI_COMMIT_SHA"'"}'

      # Compute HMAC-SHA256 signature
      SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')"

      # POST to the webhook server
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -X POST \
        -H "Content-Type: application/json" \
        -H "X-Hub-Signature-256: $SIGNATURE" \
        -d "$PAYLOAD" \
        "$DEPLOY_WEBHOOK_URL")

      if [ "$HTTP_STATUS" -eq 200 ]; then
        echo "Deployment triggered successfully (tag: $CI_COMMIT_TAG)"
      else
        echo "Webhook returned HTTP $HTTP_STATUS — deployment not triggered"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - build-and-push
