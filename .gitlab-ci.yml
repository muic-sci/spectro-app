# .gitlab-ci.yml — the entire CI side of the deployd pattern, self-contained.
#
# deployd's contract: on a vX.Y.Z tag, the pipeline must end green and every
# image referenced by docker-compose.prod.yml at that tag must be pushed with
# that tag. This job builds the root Dockerfile (context = repo root) and
# pushes $CI_REGISTRY_IMAGE:vX.Y.Z (+ :latest, for layer caching only).
# deployd notices the tag via the project webhook it manages itself, verifies
# tag + pipeline + registry image via the GitLab API, and deploys. Set NOTHING
# else here — no deploy job, no webhook URL, no secrets.

stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_DRIVER: overlay2

build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Pull :latest for layer caching (the npm-ci deps layer is reused while
    # package-lock.json is unchanged).
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - >
      docker build
      --cache-from "$CI_REGISTRY_IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg "APP_VERSION=$CI_COMMIT_TAG"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      --tag "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
