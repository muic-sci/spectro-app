# .gitlab-ci.yml — the entire CI side of the deployd pattern.
#
# On every semver tag (vX.Y.Z) the shared template builds and pushes
#   $CI_REGISTRY_IMAGE:vX.Y.Z  and  $CI_REGISTRY_IMAGE:latest
# from the root Dockerfile (context = repo root; APP_VERSION build-arg is passed
# automatically). deployd notices new tags via the project webhook it manages
# itself, verifies tag + pipeline + registry image via the GitLab API, and
# deploys. Set NOTHING else here — no deploy job, no webhook URL, no secrets.

include:
  - project: muzoo/deployd
    ref: main
    file: ci/deployd-build.gitlab-ci.yml
